<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NITDA DG/CEO Digital Operations Hub — Executive SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- cdn.tailwindcss.com is the Tailwind JIT compiler, served unversioned and unpinnable —
       it has no immutable URL and no integrity hash is possible against it. It is also a
       development tool that Tailwind explicitly does not recommend for production.
       OUTSTANDING: replace with a built stylesheet vendored into this tree. Until then this
       origin executes third-party JavaScript on every page load. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','Arial','sans-serif'] },
            colors: {
              nitda: '#05583B'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: light; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 999px; }
    .watermark {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0.05; font-weight: 800; font-size: 72px; transform: rotate(-18deg);
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app"></div>

  <!-- PINNED. This was `lucide@latest`, which resolves to whatever the registry publishes
       at page load — arbitrary third-party JavaScript executing in this origin, with access
       to its localStorage and session. A fixed version removes the mutable-tag risk.
       STILL OUTSTANDING: no integrity hash. SRI cannot be added without fetching the file,
       which this environment cannot reach. Generate and add it before any deployment:
         curl -sL https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js \
           | openssl dgst -sha384 -binary | openssl base64 -A
       then add integrity="sha384-<hash>" crossorigin="anonymous" to this tag.
       Vendoring the file into the repository, as the root platform does with its own design
       system, is the stronger fix and removes the CDN dependency entirely. -->
  <script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
  <!-- Runtime config: copy config.example.js → config.local.js and set window.DGO_CONFIG.
       The onerror handler is intentional — the file is optional. -->
  <script src="./config.local.js" onerror="void 0"></script>
  <!-- Optional: replace with your existing Power Automate client if you already use one -->
  <script src="./powerAutomateClient.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
