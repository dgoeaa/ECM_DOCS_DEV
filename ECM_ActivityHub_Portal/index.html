<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NITDA DG/CEO Digital Operations Hub — Executive SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','Arial','sans-serif'] },
            colors: {
              nitda: '#05583B'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: light; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 999px; }
    .watermark {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0.05; font-weight: 800; font-size: 72px; transform: rotate(-18deg);
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Runtime config: copy config.example.js → config.local.js and set window.DGO_CONFIG.
       The onerror handler is intentional — the file is optional. -->
  <script src="./config.local.js" onerror="void 0"></script>
  <!-- Optional: replace with your existing Power Automate client if you already use one -->
  <script src="./powerAutomateClient.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
