<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Executive Operations Hub</title>
    <style>
        /* Auto-Sensing Theme Variables */
        :root {
            --bg: #f3f4f6; --surface: #ffffff; --text-main: #111827; --text-muted: #6b7280;
            --border: #e5e7eb; --primary: #2563eb; --primary-hover: #1d4ed8;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827; --surface: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af;
                --border: #374151; --primary: #3b82f6; --primary-hover: #60a5fa;
            }
        }

        /* Core Typography & Layout */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; padding-bottom: 100px; transition: background 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.5rem; margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        
        /* Executive Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .card.removing { opacity: 0; transform: scale(0.95); pointer-events: none; }
        
        /* Metadata & Badges */
        .badge-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .badge { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge.medium { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge.finance { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        
        .card-title { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px 0; line-height: 1.3; }
        .card-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
        
        /* Fluid Action Buttons */
        .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
        button { font-family: inherit; font-size: 0.95rem; font-weight: 600; padding: 12px 16px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px; }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-approve { background: var(--success); color: white; }
        .btn-reject { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .btn-delegate { background: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .btn-view { background: transparent; border: 1px solid var(--border); color: var(--text-main); }

        /* Modal Subsystem */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--surface); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
        textarea, select { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text-main); font-family: inherit; margin-bottom: 16px; font-size: 1rem; resize: none; }
        textarea:focus, select:focus { outline: 2px solid var(--primary); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions .btn-cancel { flex: 1; background: var(--border); color: var(--text-main); }
        .modal-actions .btn-confirm { flex: 2; background: var(--primary); color: white; }

        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 200; width: 90%; max-width: 400px; }
        .toast { background: var(--text-main); color: var(--surface); padding: 14px 20px; border-radius: 12px; font-weight: 500; font-size: 0.95rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); opacity: 0; transform: translateY(20px); animation: slideUp 0.3s forwards, fadeOut 0.3s 3s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Executive Hub</h1>
        <div class="badge" id="task-counter">Loading...</div>
    </div>

    <div id="feed">
        <!-- DYNAMIC_CONTENT_MARKER -->
    </div>

    <!-- The Action Modal -->
    <div class="modal-overlay" id="action-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">Action Required</div>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm" id="modal-confirm" onclick="submitModalAction()">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const API_ENDPOINT = "YOUR_POST_FLOW_URL_HERE"; 
        
        let currentAction = {}; // Stores state for the active modal

        // Update Counter on load
        function updateCounter() {
            const count = document.querySelectorAll('.card:not(.removing)').length;
            document.getElementById('task-counter').innerText = count + ' Pending';
            if (count === 0) {
                document.getElementById('feed').innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px;">All caught up.</div>';
            }
        }
        window.onload = updateCounter;

        // Toast System
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // Direct Action (e.g., Fast Approve)
        async function quickAction(itemId, actionType, btnElement) {
            const card = btnElement.closest('.card');
            btnElement.disabled = true;
            btnElement.innerHTML = 'Processing...';
            await executeAction(itemId, actionType, "", card);
        }

        // Modal Action (Reject / Delegate)
        function openModal(itemId, actionType) {
            currentAction = { itemId, actionType };
            const modal = document.getElementById('action-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            if (actionType === 'reject') {
                title.innerText = "Reject Document";
                body.innerHTML = `<textarea id="modal-input" rows="3" placeholder="Provide reason for rejection (Required)..."></textarea>`;
            } else if (actionType === 'delegate') {
                title.innerText = "Delegate Task";
                body.innerHTML = `
                    <select id="modal-input">
                        <option value="COO">Chief Operating Officer</option>
                        <option value="CFO">Chief Financial Officer</option>
                        <option value="Legal">Legal Counsel</option>
                    </select>
                    <textarea id="modal-comments" rows="2" placeholder="Instructions for delegatee..."></textarea>
                `;
            }
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('action-modal').classList.remove('active');
            currentAction = {};
        }

        // Submit from Modal
        async function submitModalAction() {
            const inputVal = document.getElementById('modal-input').value;
            if (currentAction.actionType === 'reject' && !inputVal.trim()) {
                alert("Please provide a reason.");
                return;
            }
            
            const btn = document.getElementById('modal-confirm');
            btn.disabled = true;
            btn.innerText = "Executing...";

            let payloadData = inputVal;
            if (currentAction.actionType === 'delegate') {
                payloadData = { to: inputVal, instructions: document.getElementById('modal-comments').value };
            }

            const card = document.getElementById(`task-${currentAction.itemId}`);
            await executeAction(currentAction.itemId, currentAction.actionType, payloadData, card);
            
            closeModal();
            btn.disabled = false;
            btn.innerText = "Confirm";
        }

        // The Core API Call
        async function executeAction(itemId, action, payload, cardElement) {
            try {
                // Ensure your Power Automate POST flow is expecting this JSON schema
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemid: itemId, action: action, data: payload })
                });

                if (response.ok) {
                    showToast(`Successfully processed: ${action.toUpperCase()}`);
                    cardElement.classList.add('removing');
                    setTimeout(() => {
                        cardElement.remove();
                        updateCounter();
                    }, 300);
                } else {
                    throw new Error('Network response was not ok');
                }
            } catch (error) {
                showToast("Connection failed. Please try again.");
                const buttons = cardElement.querySelectorAll('button');
                buttons.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
