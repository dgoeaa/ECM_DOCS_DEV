<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NITDA Stats Screen</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;font-family:'Segoe UI',Verdana,Arial,sans-serif;background:#f5f5f5;color:#333;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;width:100vw;background:#f5f5f5;overflow:hidden}
#navBar{display:flex;flex-direction:row;height:30px;min-height:20px;width:100%;background:#d6dde0;overflow-x:auto;overflow-y:hidden;flex-shrink:0;scrollbar-width:none}
#navBar::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;justify-content:flex-start;padding:0 8px 0 6px;border:none;font-family:Verdana,sans-serif;font-size:8pt;font-weight:normal;white-space:nowrap;flex:1 1 auto;min-width:80px;height:30px;transition:background .15s;position:relative;text-align:left;color:#008B8B;background:#fff;border-right:1px solid #ccd}
.nav-item.active{background:#008B8B;color:#fff}
.nav-item:hover:not(.active){background:#e8f3f3}
.nav-item .nav-dot{display:none;width:5px;height:5px;border-radius:50%;background:#fff;margin-left:auto}
.nav-item.active .nav-dot{display:inline-block}
#monthBar{display:flex;flex-direction:row;height:30px;width:100%;border:1px solid #00746e;background:#fff;flex-shrink:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#monthBar::-webkit-scrollbar{display:none}
.month-btn{display:flex;align-items:center;justify-content:flex-start;padding:0 8px;border:none;font-family:Verdana,sans-serif;font-size:10pt;font-weight:normal;white-space:nowrap;height:30px;min-width:60px;flex:1 1 auto;background:transparent;color:rgba(5,88,59,0.5);transition:background .15s,color .15s}
.month-btn.selected{background:rgba(5,88,59,0.5);color:#fff}
.month-btn:hover:not(.selected){background:rgba(56,96,178,0.4);color:#fff}
.month-chevron{margin-left:auto;color:#05583B;font-size:11px;display:none}
.month-btn:not(.selected) .month-chevron{display:inline-block}
#hdr1,#hdr2{display:flex;flex-direction:row;flex-wrap:wrap;height:auto;min-height:30px;width:100%;background:#fff;border-radius:8px;flex-shrink:0;align-items:stretch;padding:1px;gap:1px}
.hdr-btn{font-family:Verdana,sans-serif;font-size:8pt;font-weight:normal;height:30px;min-height:25px;min-width:120px;padding:0 12px 0 18px;border:1px solid;text-align:left;white-space:nowrap;flex:1 1 auto;transition:filter .15s;display:inline-flex;align-items:center;justify-content:flex-start;gap:6px}
.hdr-btn:hover:not(:disabled){filter:brightness(0.92)}
.hdr-btn:disabled{opacity:.45;cursor:not-allowed}
.btn-generate{background:#2d8028;color:#fff;border-color:rgba(5,88,59,0.95)}
.btn-white-cyan{background:#fff;color:#008B8B;border-color:rgba(5,88,59,0.95)}
.btn-teal{background:#3e8095;color:#fff;border-color:rgba(5,88,59,0.95)}
.btn-orange{background:#e05606;color:#fff;border-color:rgba(5,88,59,0.95);font-weight:bold}
.btn-blue{background:#b4d6fa;color:#008B8B;border-color:rgba(5,88,59,0.95)}
.dp-wrap{display:flex;align-items:center;gap:4px;padding:0 6px;flex-shrink:0;height:30px}
.dp-wrap label{font-family:Verdana,sans-serif;font-size:7pt;color:#333;white-space:nowrap;font-weight:bold}
.dp-wrap input[type="date"]{font-family:Verdana,sans-serif;font-size:8pt;height:26px;border:1px solid #05583b;border-radius:4px;padding:2px 4px;background:#fff;color:#333;min-width:120px}
.recip-wrap{display:flex;flex-direction:column;gap:2px;padding:0 6px;flex:2 1 220px;min-width:200px;height:auto;justify-content:center;position:relative}
.recip-input-row{display:flex;align-items:center;gap:4px;min-height:30px;border:1px solid #008B8B;border-radius:4px;background:rgba(0,139,139,0.06);padding:2px 6px;flex-wrap:wrap}
.recip-input-row input{flex:1;border:none;outline:none;background:transparent;height:24px;font-size:8pt;font-family:Verdana,sans-serif;color:#333;min-width:80px}
.recip-chip{display:inline-flex;align-items:center;gap:4px;background:#0078D4;color:#fff;padding:2px 6px;border-radius:10px;font-size:7pt;cursor:default;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.recip-chip span.x{cursor:pointer;font-weight:bold;padding:0 2px}
.recip-suggest{position:absolute;top:32px;left:6px;right:6px;background:#fff;border:1px solid #008B8B;border-radius:4px;max-height:240px;overflow-y:auto;z-index:5000;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
.recip-suggest.open{display:block}
.recip-suggest-item{padding:6px 10px;font-size:8pt;cursor:pointer;border-bottom:1px solid #eee}
.recip-suggest-item:hover,.recip-suggest-item.hl{background:#0078D4;color:#fff}
.recip-suggest-item .name{font-weight:bold}
.recip-suggest-item .mail{font-size:7pt;opacity:.75}
#reportInfoBadge{display:none;align-items:center;padding:0 8px;font-family:Verdana,sans-serif;font-size:7pt;color:#055;background:#e6f7f9;border:1px solid #b0d8d8;border-radius:4px;flex-shrink:0;height:30px;white-space:nowrap;gap:6px;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#reportInfoBadge.show{display:flex}
#bottom{flex:1 1 auto;display:flex;flex-direction:column;background:#f5f5f5;padding:2px;overflow:hidden;min-height:0;position:relative}
.view{display:none;width:100%;height:100%;overflow:auto;background:#fff}
.view.active{display:block}
#galleryCards{padding:6px;background:#f5f5f5}
.report-card{font-family:'Segoe UI',sans-serif;background:#f4f6f9;border:1px solid #dcdcdc;border-radius:10px;padding:14px;margin:8px 4px;box-shadow:0 2px 6px rgba(0,0,0,.05);cursor:pointer;transition:all .25s;overflow:hidden}
.report-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rc-title{margin:0;color:#023F2D;font-size:13px;font-weight:bold;line-height:1.3}
.rc-refid{margin:4px 0 0;font-size:11px;color:#6c757d}
.rc-status-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.rc-status-emoji{font-size:18px}
.rc-status-badge{padding:5px 10px;border-radius:14px;font-size:11px;color:#fff;font-weight:600;white-space:nowrap}
.rc-divider{margin:10px 0;border:0;border-top:1px solid #dcdcdc}
.rc-grid{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.rc-grid > div{flex:1 1 180px}
.rc-grid strong{display:block;font-size:11px;color:#666;margin-bottom:2px}
.rc-detail{margin-top:12px;font-size:12px;color:#333;background:#fff;padding:10px;border-radius:6px;border:1px solid #e8e8e8}
.rc-detail strong{display:block;margin-bottom:4px;color:#023F2D}
.rc-actions{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rc-toggle{padding:4px 12px;background:#0078D4;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer}
.rc-toggle:hover{background:#106ebe}
.rc-doc-link{padding:6px 12px;background:#17A2B8;color:#fff;text-decoration:none;border-radius:6px;font-size:11px}
.rc-doc-link:hover{background:#138496}
.html-view{background:#fff}
.html-view iframe{width:100%;height:100%;border:none;display:block}
.list-gallery{background:#fff;border:2px solid #a6a6a6;height:100%;overflow-y:auto}
.lg-header{display:grid;grid-template-columns:2fr 1.2fr 1.4fr 1fr 1.6fr 1fr 1.4fr 1fr;background:#E8F5F1;padding:8px;font-family:'Segoe UI',sans-serif;font-size:11px;font-weight:bold;color:#023F2D;border-bottom:2px solid #023F2D;position:sticky;top:0;z-index:1}
.lg-row{display:grid;grid-template-columns:2fr 1.2fr 1.4fr 1fr 1.6fr 1fr 1.4fr 1fr;padding:6px 8px;font-family:'Segoe UI',sans-serif;font-size:11px;border-bottom:1px solid #eee;align-items:center;min-height:42px;cursor:pointer;transition:background .15s}
.lg-row:hover{background:#f0f7f4}
.lg-row .c-title{color:#005e92;font-weight:600;text-decoration:underline}
.lg-row .c-status{text-align:center}
.lg-row .c-date{text-align:center;font-variant-numeric:tabular-nums}
#view9 .charts-wrap{padding:16px;background:#f9f9f9;height:100%;overflow:auto}
.empty,.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:240px;color:#999;font-family:Verdana,sans-serif;font-size:12px;gap:10px;padding:24px;text-align:center}
.empty svg,.placeholder svg{opacity:.3}
.placeholder h3{color:#aaa;font-weight:normal}
#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.78);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loading.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid #dce8f5;border-top-color:#0078D4;border-radius:50%;animation:spin .9s linear infinite}
.spinner-label{font-family:Verdana,sans-serif;font-size:12px;color:#0078D4;font-weight:bold}
@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;top:14px;right:14px;z-index:9998;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{padding:10px 14px;border-radius:6px;font-family:Verdana,sans-serif;font-size:9pt;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18);animation:slideIn .3s ease;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.toast .x{cursor:pointer;font-weight:bold;font-size:14px;opacity:.8}
.toast .x:hover{opacity:1}
.toast-success{background:#107C10}.toast-warning{background:#e07000}.toast-error{background:#a92323}.toast-info{background:#0078D4}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.hdr-btn.busy{position:relative;color:transparent !important}
.hdr-btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;color:#fff;animation:spin .8s linear infinite}
.btn-white-cyan.busy::after,.btn-blue.busy::after{color:#008B8B}
@media (max-width:780px){
  .hdr-btn{min-width:100px;font-size:7pt;padding-left:10px}
  .lg-header,.lg-row{grid-template-columns:2fr 1fr 1fr 1fr}
  .lg-header .hide-sm,.lg-row .hide-sm{display:none}
  .month-btn{font-size:8pt;min-width:48px}
  .nav-item{font-size:7pt;min-width:60px}
}
@media (max-width:520px){
  .recip-wrap{flex:1 1 100%}.dp-wrap{flex:1 1 100%}
  .hdr-btn{flex:1 1 calc(50% - 4px);min-width:0}
}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite"><div class="spinner"></div><div class="spinner-label" id="loadingLabel">Loading…</div></div>
<div id="toasts" aria-live="polite" aria-atomic="true"></div>
<div id="app">
  <nav id="navBar" role="tablist" aria-label="Screen navigation"></nav>
  <div id="monthBar" role="tablist" aria-label="View tab"></div>
  <div id="hdr1">
    <button class="hdr-btn btn-generate" id="btnGenerate" type="button">Generate Report</button>
    <div id="reportInfoBadge"></div>
    <button class="hdr-btn btn-orange" id="btnReport" type="button">Report</button>
    <button class="hdr-btn btn-blue" id="btnGetSP" type="button">Get SharepointReport</button>
    <div class="dp-wrap" id="datePickers">
      <label for="dpStart">From</label><input type="date" id="dpStart" />
      <label for="dpEnd">To</label><input type="date" id="dpEnd" />
    </div>
    <button class="hdr-btn btn-teal report-only" id="btnReport3" type="button" style="display:none">Report 3</button>
    <button class="hdr-btn btn-teal report-only" id="btnReport4" type="button" style="display:none">Report 4</button>
    <button class="hdr-btn btn-white-cyan report-only" id="btnSend38" type="button" style="display:none">Send Report 38</button>
    <button class="hdr-btn btn-white-cyan report-only" id="btnSendV1" type="button" style="display:none">Send Report V1</button>
    <button class="hdr-btn btn-white-cyan report-only" id="btnSend24_2" type="button" style="display:none">24_2</button>
    <button class="hdr-btn btn-white-cyan report-only" id="btnSend37" type="button" style="display:none">Send Report 37</button>
  </div>
  <div id="hdr2" style="display:none">
    <div class="recip-wrap">
      <div class="recip-input-row" id="recipChips"><input type="text" id="recipInput" placeholder="Type to search users…" autocomplete="off"/></div>
      <div class="recip-suggest" id="recipSuggest" role="listbox"></div>

  </div>
  <div id="bottom">
    <div id="view1" class="view"><div id="galleryCards"></div></div>
    <div id="view2" class="view html-view"></div>
    <div id="view3" class="view html-view"></div>
    <div id="view4" class="view html-view"></div>
    <div id="view5" class="view html-view"></div>
    <div id="view6" class="view html-view"></div>
    <div id="view7" class="view list-gallery">
      <div class="lg-header"><span>Activity Title</span><span class="hide-sm">Activity Status</span><span class="hide-sm">Assignment</span><span class="hide-sm">Priority</span><span>Category</span><span class="hide-sm">Act. Date</span><span>Assigned To</span><span class="hide-sm">Task Date</span></div>
      <div id="lg7Body"></div>
    </div>
    <div id="view8" class="view list-gallery">
      <div class="lg-header"><span>Activity Title</span><span class="hide-sm">Activity Status</span><span class="hide-sm">Assignment</span><span class="hide-sm">Priority</span><span>Category</span><span class="hide-sm">Act. Date</span><span>Assigned To</span><span class="hide-sm">Task Date</span></div>
      <div id="lg8Body"></div>
    </div>
    <div id="view9" class="view"><div class="charts-wrap" id="chartsBody"></div></div>
    <div id="view10" class="view list-gallery">
      <div class="lg-header"><span>Assigned To</span><span class="hide-sm">Task Date</span><span class="hide-sm">Activity Title</span><span class="hide-sm">Activity Status</span><span>Assignment</span><span class="hide-sm">Priority</span><span>Category</span><span class="hide-sm">Act. Date</span></div>
      <div id="lg10Body"></div>
    </div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
 * POWER AUTOMATE FLOW ENDPOINTS — byte-for-byte from project files
 * ============================================================ */
const FLOW = Object.freeze({

const collections = {

    {Name:"E-mails",Screen:"EmailClient_Screen"},{Name:"Dashboard",Screen:"DashboardScreen"},

};
const MONTH_TABS = ["M1","M2","M3","M4","M5","M6","M7","M8","M9","M10","All","None"];
const $=id=>document.getElementById(id);
const el=(t,p={})=>{const n=document.createElement(t);for(const k in p){if(k==='style')Object.assign(n.style,p[k]);else if(k==='class')n.className=p[k];else if(k==='html')n.innerHTML=p[k];else if(k==='text')n.textContent=p[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),p[k]);else n.setAttribute(k,p[k])}return n};
const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lower(s){return String(s==null?'':s).toLowerCase()}
function trim(s){return String(s==null?'':s).trim()}
function proper(s){return String(s==null?'':s).replace(/\b\w/g,c=>c.toUpperCase())}
function upper(s){return String(s==null?'':s).toUpperCase()}
function isBlank(v){return v==null||(typeof v==='string'&&v.trim()==='')}
function dateValue(v){if(!v)return null;if(v instanceof Date)return isNaN(v)?null:v;const d=new Date(v);return isNaN(d)?null:d}
function dateDiffMinutes(a,b){const x=dateValue(a),y=dateValue(b);if(!x||!y)return 0;return Math.round(Math.abs(y-x)/60000)}
function dateDiffDays(a,b){const x=dateValue(a),y=dateValue(b);if(!x||!y)return 0;return Math.round(Math.abs(y-x)/86400000)}
function roundDown(n,d){const p=Math.pow(10,d||0);return Math.floor((Number(n)||0)*p)/p}
function maxBy(arr,k){if(!arr||!arr.length)return 0;return arr.reduce((m,r)=>Math.max(m,Number(r[k])||0),0)}
function sumBy(arr,k){if(!arr||!arr.length)return 0;return arr.reduce((m,r)=>m+(Number(r[k])||0),0)}
const MON_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY_S=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_L=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad2=n=>String(n).padStart(2,'0');
function textFmt(d,fmt){
  d=dateValue(d); if(!d) return '';
  switch(fmt){
    case 'mm/dd/yy':return `${pad2(d.getMonth()+1)}/${pad2(d.getDate())}/${String(d.getFullYear()).slice(-2)}`;
    case 'dd-mmm-yyyy':return `${pad2(d.getDate())}-${MON_S[d.getMonth()]}-${d.getFullYear()}`;
    case 'dd mmm yyyy':return `${pad2(d.getDate())} ${MON_S[d.getMonth()]} ${d.getFullYear()}`;
    case 'longdate':return `${DAY_L[d.getDay()]}, ${d.getDate()} ${MON_L[d.getMonth()]} ${d.getFullYear()}`;
    case 'ddd, dd mmm yyyy':return `${DAY_S[d.getDay()]}, ${pad2(d.getDate())} ${MON_S[d.getMonth()]} ${d.getFullYear()}`;
    case 'ddd, dd mmm yyyy hh:mm AM/PM':{let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${DAY_S[d.getDay()]}, ${pad2(d.getDate())} ${MON_S[d.getMonth()]} ${d.getFullYear()} ${pad2(h)}:${pad2(d.getMinutes())} ${ap}`;}
    case 'dddd, dd mmm yyyy hh:mm AM/PM':{let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${DAY_L[d.getDay()]}, ${pad2(d.getDate())} ${MON_S[d.getMonth()]} ${d.getFullYear()} ${pad2(h)}:${pad2(d.getMinutes())} ${ap}`;}
    case 'yyyy-mm-ddTHH:mm:ssZ':return d.toISOString().replace(/\.\d{3}Z$/,'Z');
    case 'yyyymmddhhmm':return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    case 'yyyymmdd-HHmmss':return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
    case 'yyyy':return String(d.getFullYear());
    default:return d.toISOString();
  }
}
function formatAvgMinutes(mins){
  mins=Number(mins)||0; if(!mins)return '0 mins';
  if(mins>=1440){const days=Math.trunc(mins/1440);const hrs=Math.trunc((mins/60)%24);const m=Math.trunc(mins%60);return `${days} days ${hrs} hrs ${m} mins`;}
  if(mins>=60){const hrs=Math.trunc(mins/60);const m=Math.trunc(mins%60);return `${hrs} hrs ${m} mins`;}
  return `${Math.trunc(mins)} mins`;
}
function generateReportID(){
  const ts=textFmt(new Date(),'yyyymmdd-HHmmss');
  const rand=String(Math.floor(Math.random()*100000)).padStart(5,'0');
  return `REP-${ts}-${rand}`;
}

  if(['in progress','not assigned'].includes(v))return '#FFC107';
  if(['overdue','not started'].includes(v))return '#DC3545';
  if(v==='pending')return '#17A2B8';

}

async function callFlow(url, payload, opts={}){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), opts.timeoutMs || CFG.REQUEST_TIMEOUT_MS);
  let response;
  try{
    response = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json; charset=utf-8','Accept':'application/json'},
      body: JSON.stringify(payload),
      signal: ctrl.signal, mode:'cors', credentials:'omit', cache:'no-store'
    });
  } catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError') throw new Error('Request timed out');
    throw new Error(`Network error: ${e.message}`);
  } finally { clearTimeout(timer); }
  const text = await response.text().catch(()=>'');
  let body;
  try {
    body = text ? JSON.parse(text) : {};
    if (typeof body === 'string') { try { body = JSON.parse(body); } catch(_){} }
  } catch(_) { body = { raw:text }; }
  if(!response.ok){
    const msg = (body && (body.errors?.[0]?.message || body.message || body.error?.message)) || `HTTP ${response.status}`;
    const err = new Error(msg); err.status = response.status; err.body = body; throw err;
  }
  if(body && typeof body === 'object' && body.ok === false && Array.isArray(body.errors) && body.errors.length){
    const err = new Error(body.errors.map(e=>e.message||String(e)).join('; '));
    err.status = body.status?.http || 500; err.body = body; throw err;
  }
  try { window.NITDA_STATS && (window.NITDA_STATS.lastResponse = body); } catch(_){}
  return body;
}
function unwrap(body){
  if(body==null) return null;
  if(Array.isArray(body)) return body;
  if(body.data!=null) return body.data;
  if(body.result!=null) return body.result;
  if(body.value!=null) return body.value;
  if(body.items!=null) return body.items;
  return body;
}
function extractArray(body){
  let v = unwrap(body);
  if(typeof v === 'string'){ try { v = JSON.parse(v); } catch(_){ return []; } }
  if(Array.isArray(v)) return v;
  if(v && typeof v==='object'){
    const ARR_KEYS = ['reportdata','reportData','Report_Data','records','list','rows','tasks','users','docs','emails','results','data','items','value','body','response','output','payload'];
    for(const k of ARR_KEYS){
      if(Array.isArray(v[k])) return v[k];
      if(typeof v[k]==='string'){ try { const p = JSON.parse(v[k]); if(Array.isArray(p)) return p; } catch(_){} }
    }
    // Last-resort scan: any first-level array property
    for(const k of Object.keys(v)){
      if(Array.isArray(v[k]) && v[k].length && typeof v[k][0]==='object') return v[k];
    }
    // Recurse one level
    for(const k of Object.keys(v)){
      if(v[k] && typeof v[k]==='object' && !Array.isArray(v[k])){
        for(const kk of ARR_KEYS){ if(Array.isArray(v[k][kk])) return v[k][kk]; }
      }
    }
  }
  return [];
}
function toast(msg,type='info',ttl=5500){
  const c=$('toasts'); if(!c)return;
  while(c.children.length>=CFG.MAX_TOASTS) c.removeChild(c.firstChild);
  const t=el('div',{class:`toast toast-${type}`,html:`<span>${escHtml(msg)}</span><span class="x">×</span>`});
  t.addEventListener('click',()=>t.remove());
  c.appendChild(t);
  if(ttl>0)setTimeout(()=>{ if(t.parentNode) t.remove(); }, ttl);
}

function groupCount(arr,key){
  const m=new Map();
  arr.forEach(r=>{const v=lower(trim(String(r[key]||'')));m.set(v,(m.get(v)||0)+1);});
  return Array.from(m,([Value,Count])=>({Value,Count}));
}
function computeAggregates(rows){
  if(!rows||!rows.length) return false;
  state.varAggregates = {
    Category:groupCount(rows,'Task_Category'), Priority:groupCount(rows,'Task_Priority'),
    TaskStatus:groupCount(rows,'Task_Status'), AssignedTo:groupCount(rows,'Task_Assigned_To'),
    ActivityAssignStatus:groupCount(rows,'Activity_AssignmentStatus'),
    ActivityStatus:groupCount(rows,'Activity_Status')
  };
  const sortDesc = a => [...a].sort((x,y)=>y.Count-x.Count);
  state.varSortedCounts = {
    Category:sortDesc(state.varAggregates.Category), Priority:sortDesc(state.varAggregates.Priority),
    TaskStatus:sortDesc(state.varAggregates.TaskStatus), AssignedTo:sortDesc(state.varAggregates.AssignedTo),
    ActivityAssignStatus:sortDesc(state.varAggregates.ActivityAssignStatus),
    ActivityStatus:sortDesc(state.varAggregates.ActivityStatus)
  };
  const valid = rows.filter(r=>!isBlank(r.Activity_DateCreated)&&!isBlank(r.Task_Creation_Date));
  state.varAvgTimeMinutes = valid.length ? valid.reduce((s,r)=>s+dateDiffMinutes(r.Activity_DateCreated,r.Task_Creation_Date),0)/valid.length : 0;
  state.varAvgTimeFormatted = formatAvgMinutes(state.varAvgTimeMinutes);
  collections.colProcessedDates = rows.map(r=>({...r,ProcessedActivityDate:r.Activity_DateCreated})).filter(r=>!isBlank(r.ProcessedActivityDate));
  if(collections.colProcessedDates.length){
    const ts = collections.colProcessedDates.map(r=>r.ProcessedActivityDate.getTime());
    state.varEarliestActivityDate = new Date(Math.min(...ts));
    state.varLatestActivityDate = new Date(Math.max(...ts));
    if(state.varEarliestActivityDate.getTime()===state.varLatestActivityDate.getTime()){
      state.varReportPeriod = textFmt(state.varEarliestActivityDate,'longdate');
    } else {
      state.varReportPeriod = textFmt(state.varEarliestActivityDate,'longdate')+' to '+textFmt(state.varLatestActivityDate,'longdate');
    }
    state.varReportDurationDays = dateDiffDays(state.varEarliestActivityDate,state.varLatestActivityDate)+1;
  } else {
    state.varEarliestActivityDate=null;state.varLatestActivityDate=null;
    state.varReportPeriod='No data available';state.varReportDurationDays=0;
  }
  collections.colReportSummary = [
    {Metric:"Average Time",Value:state.varAvgTimeFormatted},
    {Metric:"Report Period",Value:state.varReportPeriod},
    {Metric:"Duration (Days)",Value:String(state.varReportDurationDays)}
  ];
  const totalAS = sumBy(state.varSortedCounts.ActivityStatus,'Count');
  let run=0;
  collections.varDonutSegments = state.varSortedCounts.ActivityStatus.map(r=>{
    const start = Math.round((run/(totalAS||1))*360);
    const end = Math.round(((run+r.Count)/(totalAS||1))*360);
    run += r.Count;
    return {Color:getActivityStatusColor(r.Value),StartAngle:start,EndAngle:end,Value:r.Value,Count:r.Count};
  });
  collections.colReportWithIndex = rows.map((r,i)=>({...r,RowIndex:rows.length-i}));
  collections.colReportWithIndexSorted = [...collections.colReportWithIndex].sort((a,b)=>a.RowIndex-b.RowIndex);
  state.varKPICompleted = (state.varSortedCounts.ActivityStatus.find(r=>r.Value==='assigned')||{Count:0}).Count;
  return true;
}
function buildHTMLDonutCanvas(){
  const sc=state.varSortedCounts.ActivityStatus;
  const completedCount = (sc.find(r=>lower(r.Value)==='assigned')||{Count:0}).Count;
  const progressCount = (sc.find(r=>lower(r.Value)==='not assigned')||{Count:0}).Count;
  const total = sumBy(sc,'Count')||1;
  const cp = roundDown((completedCount/total)*100,0);
  const pp = roundDown((progressCount/total)*100,0);
  return `<div style="width:160px;height:160px;margin:auto;border-radius:50%;background:conic-gradient(#28A745 0% ${cp}%,#FFC107 ${cp}% ${cp+pp}%,#DC3545 ${cp+pp}% 100%);display:flex;align-items:center;justify-content:center;"><div style="width:80px;height:80px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:#023F2D;">${cp}%</div></div>`;
}
function buildBarBlock(items, colorFn, title, useProper=true){
  const max=maxBy(items,'Count')||1;
  const rows=items.map(r=>{
    const pct=roundDown((r.Count/max)*100,0);
    const lbl=useProper?proper(r.Value||''):r.Value||'';
    return `<div style="margin-bottom:10px;"><div style="font-size:13px;margin-bottom:4px;">${escHtml(lbl)} (${r.Count})</div><div style="width:100%;background:#eee;height:16px;border-radius:4px;"><div style="width:${pct}%;background:${colorFn(r.Value)};height:100%;border-radius:4px;"></div></div></div>`;
  }).join('');
  return `<div style="margin-top:20px;"><h3 style="color:#023F2D;font-size:16px;">${escHtml(title)}</h3>${rows}</div>`;
}
function buildSVGDonut(){
  const segs=collections.varDonutSegments;
  if(!segs.length) return `<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="#eee"/></svg>`;
  const cx=100,cy=100,r=80;
  const paths=segs.map(s=>{
    const sa=(s.StartAngle-90)*Math.PI/180, ea=(s.EndAngle-90)*Math.PI/180;
    const x1=cx+r*Math.cos(sa), y1=cy+r*Math.sin(sa);
    const x2=cx+r*Math.cos(ea), y2=cy+r*Math.sin(ea);
    const large = (s.EndAngle-s.StartAngle)>180?1:0;
    return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${s.Color}" stroke="#fff" stroke-width="1"/>`;
  }).join('');
  return `<svg width="200" height="200" viewBox="0 0 200 200">${paths}</svg>`;
}

async function flowGenerateReport(queryString, reportID){
  const payload = {
    name:"GenerateReport",action:"generateReport",Action:"generateReport",
    operation:"read",Operation:"read",method:"POST",
    source:CFG.SOURCE,userEmail:CFG.CURRENT_USER_EMAIL,UserEmail:CFG.CURRENT_USER_EMAIL,email:CFG.CURRENT_USER_EMAIL,
    text:queryString,text_1:reportID,reportId:reportID,filter:queryString,
    contextType:"report",
    device:{id:"standalone-html",platform:navigator.platform||'',ua:navigator.userAgent||''}
  };
  const body = await callFlow(DISPATCH.generateReport, payload);
  // Unwrap possibly double-encoded envelope
  let root = body;
  if(typeof root === 'string'){ try { root = JSON.parse(root); } catch(_){} }
  const data = (root && root.data) || root;
  // Try report-specific keys
  let rd = data && (data.reportdata || data.reportData || data.Report_Data || data.tasks || data.records);
  if(typeof rd === 'string'){ try { rd = JSON.parse(rd); } catch(_){ rd = null; } }
  if(Array.isArray(rd)) return rd;
  // Generic fallback
  return extractArray(body);
}
async function flowLookupTasksReport(reportID){
  const payload = {
    name:"LookupTasksReports",action:"lookupTasksReports",Action:"lookupTasksReports",
    operation:"read",Operation:"read",method:"POST",
    source:CFG.SOURCE,userEmail:CFG.CURRENT_USER_EMAIL,
    reportId:reportID,text:`Report ID eq '${reportID}'`,text_1:reportID,
    filter:`Report_ID eq '${reportID}'`,contextType:"sharepointLookup"
  };
  const body = await callFlow(DISPATCH.lookupTasksReports, payload);
  const arr = extractArray(body);
  if(arr.length) return arr[0];
  const u = unwrap(body);
  if(u && typeof u==='object' && !Array.isArray(u)) return u;
  return null;
}
async function flowFetchAllUsers(){
  const payload = {
    name:"FetchAllUsers",action:"lookups",Action:"lookups",
    operation:"read",Operation:"read",method:"POST",
    source:CFG.SOURCE,userEmail:CFG.CURRENT_USER_EMAIL,
    target:"colAllUsers",contextType:"users"
  };
  const body = await callFlow(DISPATCH.fetchAllUsers, payload);
  let root = body; if(typeof root==='string'){ try { root=JSON.parse(root); } catch(_){} }
  const data = (root && root.data) || root || {};

  return arr.map(normalizeUser).filter(u=>!!u.Mail);
}

  $('btnSend38').addEventListener('click',()=>handleSendReport('38','btnSend38'));
  $('btnSendV1').addEventListener('click',()=>handleSendReport('v1','btnSendV1'));
  $('btnSend24_2').addEventListener('click',()=>handleSendReport('24_2','btnSend24_2'));
  $('btnSend37').addEventListener('click',()=>handleSendReport('37','btnSend37'));
  $('btnSendAtt24_2').addEventListener('click',()=>handleSendWithAttachment('24_2','btnSendAtt24_2'));
  $('btnSendAttPerf').addEventListener('click',()=>handleSendWithAttachment('main','btnSendAttPerf'));
  const inp=$('recipInput'), sg=$('recipSuggest');
  inp.addEventListener('input',()=>showRecipSuggestions(inp.value));
  inp.addEventListener('focus',()=>showRecipSuggestions(inp.value));
  inp.addEventListener('blur',()=>setTimeout(()=>sg.classList.remove('open'),150));
  inp.addEventListener('keydown',(e)=>{
    const items = sg.querySelectorAll('.recip-suggest-item');
    if(e.key==='ArrowDown' && items.length){
      e.preventDefault();
      const cur=sg.querySelector('.hl');
      if(cur){cur.classList.remove('hl');const n=cur.nextElementSibling||items[0];n.classList.add('hl');n.scrollIntoView({block:'nearest'});}
      else items[0].classList.add('hl');
    } else if(e.key==='ArrowUp' && items.length){
      e.preventDefault();
      const cur=sg.querySelector('.hl');
      if(cur){cur.classList.remove('hl');const n=cur.previousElementSibling||items[items.length-1];n.classList.add('hl');n.scrollIntoView({block:'nearest'});}
      else items[items.length-1].classList.add('hl');
    } else if(e.key==='Enter'){
      e.preventDefault();
      const hl = sg.querySelector('.hl');
      if(hl){addRecipient({Mail:hl.dataset.mail,DisplayName:hl.dataset.name});}
      else if(inp.value && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inp.value.trim())){
        addRecipient({Mail:inp.value.trim(),DisplayName:inp.value.trim()});
      }
    } else if(e.key==='Backspace' && !inp.value && state.selectedRecipients.length){
      state.selectedRecipients.pop(); renderRecipientChips();
    } else if(e.key==='Escape'){sg.classList.remove('open');}
  });
  $('recipChips').addEventListener('click',(e)=>{
    if(e.target.id==='recipInput'||e.target.classList.contains('x'))return;
    inp.focus();
  });
}
async function onVisible(){
  Object.assign(state,{
    varReset:true,showReportButton:true,
    cb1Active:true,cb2Active:false,cb3Active:false,cb4Active:false,cb5Active:false,
    cb6Active:false,cb7Active:false,cb8Active:false,cb9Active:false,cb10Active:false
  });
  state.selectedRecipients=[]; state.varReportReceipients='';
  initDatePickers(); renderNavBar(); renderMonthBar();
  applyViewVisibility(); applyShowReportButton();
  renderRecipientChips(); renderCardGallery();
  renderListGallery('lg7Body',[],'normal');
  renderListGallery('lg8Body',[],'normal');
  renderListGallery('lg10Body',[],'assignedTo');
  renderChartsView();
  try{
    const users = await flowFetchAllUsers();
    if(users.length){collections.colAllUsers = users;}
  } catch(err){
    console.warn('[colAllUsers load]',err);
    notify(`User directory unavailable (${err.message}). You can still type emails manually.`,'Warning');
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  wireEvents();
  onVisible().catch(e=>{console.error(e);notify(`Init failure: ${e.message}`,'Error');});
});
window.NITDA_STATS = {state,collections,FLOW,DISPATCH,callFlow,flowGenerateReport,flowLookupTasksReport,flowSendEmailV2,flowHTMLReportsRun};
</script>
