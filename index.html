<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05583B">
  <!-- Content Security Policy. Meta delivery, because the runtime is a static deployment
       with no header control. Two limits are deliberate and documented:
         · frame-ancestors is IGNORED in a meta CSP — clickjacking protection still needs a
           real header at the edge. See README.md § Deployment headers.
         · script-src/style-src keep 'unsafe-inline' for the boot watchdog below and for the
           inline style attributes the modules emit. Third-party script origins are still
           blocked, which is the vector that matters for a governed operations console.
       connect-src is the exfiltration control: only Power Automate origins are reachable,
       plus 'self' for the authenticating proxy when it is deployed same-origin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.api.powerplatform.com https://*.logic.azure.com; frame-src 'self'; worker-src 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>DGO Digital Operations — R11.6 Obsidian Harmonized Design System Runtime</title>
  <link rel="icon" href="assets/dgo-mark.svg">
  <!-- Single deterministic @layer entry (see styles/index.css). Replaces 19 unordered links. -->
  <link rel="stylesheet" href="styles/index.css">
  <!-- Runtime config: copy config/config.example.js → config/config.local.js and fill in
       rotated endpoint URLs.  The onerror handler is intentional — the file is optional. -->
  <script src="config/config.local.js" onerror="void 0"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <div id="app"><div class="boot" role="status">Loading DGO Digital Operations…</div></div>
  <noscript><div class="fatal">JavaScript is required to run DGO Digital Operations.</div></noscript>
  <script type="module" src="shared/figma-uiux-runtime.js"></script>
  <script type="module" src="core/boot.js"></script>
  <!-- Boot watchdog. core/boot.js has its own try/catch, but it cannot catch a failure to
       RESOLVE the static module graph: that happens before boot() is ever invoked, so no
       catch runs, no pageerror fires, and the spinner above stays up forever — visually
       indistinguishable from a slow network. That is exactly how 12 missing config modules
       shipped unnoticed. Record module load failures and surface them if boot never lands. -->
  <script>
    (function () {
      var failed = [];
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
          var src = el.src || el.href || '';
          if (src && failed.indexOf(src) === -1) failed.push(src);
        }
      }, true);
      setTimeout(function () {
        if (window.__DGO_BOOTED__) return;
        var host = document.getElementById('app');
        if (!host || !host.querySelector('.boot')) return;
        var esc = function (s) {
          return String(s).replace(/[&<>]/g, function (m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
          });
        };
        var detail = failed.length
          ? '<p>The following resources failed to load:</p><ul>' +
            failed.map(function (u) { return '<li><code>' + esc(u) + '</code></li>'; }).join('') +
            '</ul>'
          : '<p>No failing resource was reported. Check the browser console and the network ' +
            'panel — an ES module in the graph most likely failed to resolve.</p>';
        host.innerHTML =
          '<div class="fatal"><h1>DGO could not start</h1>' +
          '<p>The runtime did not finish booting within 15 seconds.</p>' + detail +
          '<p>Serve the app over HTTP (not <code>file://</code>) and confirm every module ' +
          'under <code>config/</code>, <code>core/</code>, <code>modules/</code> and ' +
          '<code>shared/</code> is present.</p></div>';
      }, 15000);
    })();
  </script>
</body>
</html>
