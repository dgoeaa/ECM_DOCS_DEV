template_name: deployment-manifest
sanitized: true
copy_outside_repository_first: true
authoritative_runbook: docs/deployment/CLOUDFLARE.md
recommended_external_directory: ECM_DOCS_DEV-deployment-private/pilot-YYYY-MM/
pilot_window: YYYY-MM
status: planned
scope:
  implementation: cloudflare-power-automate-pilot
  repository: dgoeaa/ECM_DOCS_DEV
  branch: null
  commit: null
identifiers:
  cloudflare_account_id: null
  access_team_domain: <TEAM-DOMAIN>
  access_aud_tag: <AUD-TAG>
  worker_hostname: <WORKER-HOSTNAME>
  pages_hostname: <PAGES-HOSTNAME>
  sharepoint_upload_endpoint_reference: V8
  workflow_inventory_source: docs/cutover/FLOW_DECOMMISSION_INVENTORY.md
controls:
  power_automate_cutover_completed_before_cloudflare_secrets: null
  config_local_files_git_ignored_documented: true
  no_live_secrets_committed: true
  no_operational_values_committed: true
notes:
  - Replace nulls only in the external private copy.
  - Never paste complete trigger URLs or secret values here.
