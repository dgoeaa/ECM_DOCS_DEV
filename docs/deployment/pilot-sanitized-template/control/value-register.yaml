template_name: value-register
sanitized: true
values:
  V1:
    name: Cloudflare account ID
    source: npx wrangler whoami
    stored_in_repository: false
    value: null
  V2:
    name: Cloudflare Access team domain
    source: Cloudflare Zero Trust settings
    stored_in_repository: false
    value: <TEAM-DOMAIN>
  V3:
    name: Access application AUD tag
    source: Cloudflare Access application overview
    stored_in_repository: false
    value: <AUD-TAG>
  V4:
    name: Access group names
    source: docs/deployment/CLOUDFLARE.md D3
    stored_in_repository: true
    value:
      - DGO-SystemAdmin
      - DGO-UserAdmin
      - DGO-Executive
      - DGO-Director
      - DGO-Operator
      - DGO-Viewer
  V5:
    name: Flow trigger URLs
    source: Power Automate HTTP trigger URLs
    stored_in_repository: false
    value: NEVER_STORE_HERE
    note: >-
      Configured client-side in config/config.local.js (DGO_CONFIG.endpoints) and
      document-portal/config.local.js (PF_CONFIG.endpoints). Delivered to every
      visitor's browser, so treat each as a public bearer credential and rotate on
      a schedule. There is no Worker holding these any more.
  V6:
    name: SharePoint site URL
    source: SharePoint site
    stored_in_repository: false
    value: <SHAREPOINT-SITE-URL>
  V7:
    name: Pages project hostname
    source: wrangler pages deploy
    stored_in_repository: false
    value: <PAGES-HOSTNAME>
endpoint_url_names:
  # Configured client-side as DGO_CONFIG.endpoints / PF_CONFIG.endpoints keys.
  # Recorded here under the Part C label; no Worker secret exists for any of them.
  - DGO_ENDPOINT_BULK_ASSIGNMENT
  - DGO_ENDPOINT_SINGLE_ASSIGNMENT
  - DGO_ENDPOINT_BULK_ASSIGNMENT_DIRECT
  - DGO_ENDPOINT_GET_DOCS
  - DGO_ENDPOINT_AI_DOC_ANALYSIS
  - DGO_ENDPOINT_FETCH_EMAIL_ATTACHMENTS
  - DGO_ENDPOINT_OTP_GENERATE
  - DGO_ENDPOINT_OTP_VERIFY
  - DGO_ENDPOINT_FETCH_ALL
  - DGO_ENDPOINT_FETCH_ACTIVITIES
  - DGO_ENDPOINT_SUBSIDIARY_ACTIONS
  - DGO_ENDPOINT_AI_CHAT
  - DGO_ENDPOINT_EMAIL_RELATED_TASK
  - DGO_ENDPOINT_DYNAMIC_ACTIONS
  - DGO_ENDPOINT_EMAIL
  - DGO_ENDPOINT_REFERENCE_DATA
  - DGO_ENDPOINT_AI_EMAIL_ANALYSIS
  - DGO_ENDPOINT_INTAKE_SUBMISSION
  - DGO_ENDPOINT_INTAKE_UPLOAD
  - DGO_ENDPOINT_INTAKE_STATUS
  - DGO_ENDPOINT_INTAKE_SUPPORT
  - DGO_ENDPOINT_INTAKE_VERIFY_EMAIL
  - DGO_ENDPOINT_INTAKE_VERIFY_CONFIRM
  - DGO_ENDPOINT_SCAN_UPLOAD
  - DGO_ENDPOINT_DISPATCH_OUTBOUND
  - DGO_ENDPOINT_ARCHIVE_REFERENCE
