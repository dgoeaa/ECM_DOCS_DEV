<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05583B">
<meta name="description" content="DGO Digital Operations — complete interactive visual documentation of the platform: architecture, trust zones, front-end and back-end components, modules, data model, security, lifecycle, quality and deployment. Every figure derived from the source.">
<title>DGO Digital Operations — Platform Atlas</title>
<link rel="icon" href="../../assets/dgo-mark.svg">
<link rel="stylesheet" href="visual.css">

<!-- Theme is applied before first paint. Doing it in app.js instead produces a white
     flash on a dark-themed projector, which is exactly the room this page is used in. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('dgo.visual.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      var l = localStorage.getItem('dgo.visual.lens');
      if (l) document.documentElement.setAttribute('data-lens', l);
    } catch (e) { /* private mode — defaults are fine */ }
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="shell">

  <!-- ── Navigation rail ──────────────────────────────────────────────────────────── -->
  <aside class="rail" id="rail" aria-label="Contents">
    <div class="brand">
      <svg viewBox="0 0 56 56" role="img" aria-label="DGO mark">
        <circle cx="28" cy="28" r="20" fill="none" stroke="#17B255" stroke-width="4"/>
        <circle cx="28" cy="28" r="6" fill="#05583B"/>
        <circle cx="48" cy="28" r="2.4" fill="#17B255"/>
        <circle cx="8" cy="28" r="2.4" fill="#17B255"/>
      </svg>
      <div>
        <div class="brand-name">Platform Atlas</div>
        <div class="brand-sub">NITDA · DGO Digital Ops</div>
      </div>
    </div>

    <div class="rail-search">
      <button type="button" id="openSearch" aria-label="Search the atlas">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        Search everything
        <kbd>/</kbd>
      </button>
    </div>

    <nav class="toc" id="toc" aria-label="Sections"></nav>

    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <!-- ── Document ─────────────────────────────────────────────────────────────────── -->
  <div>
    <div class="topbar">
      <button class="iconbtn railtoggle" id="navToggle" aria-label="Show contents" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="crumb" id="crumb">Platform Atlas</span>

      <span class="spacer"></span>

      <div class="lens" id="lens" role="group" aria-label="Audience lens">
        <button type="button" data-lens="all" aria-pressed="true">Everything</button>
        <button type="button" data-lens="exec" aria-pressed="false">Executive</button>
        <button type="button" data-lens="arch" aria-pressed="false">Architect</button>
        <button type="button" data-lens="dev" aria-pressed="false">Developer</button>
        <button type="button" data-lens="ops" aria-pressed="false">Operations</button>
      </div>

      <button class="iconbtn" id="expandAll" title="Expand every collapsed panel">Expand all</button>

      <button class="iconbtn" id="themeToggle" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
      </button>

      <button class="iconbtn" id="printBtn" title="Print or save as PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 9V3h10v6M7 19H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 15h10v6H7z"/></svg>
      </button>
    </div>

    <main id="main">
      <div id="doc">
        <noscript>
          <section class="sheet"><div class="body">
            <p><strong>This atlas renders from the platform's own derived dataset and needs JavaScript.</strong>
            Every figure it shows is generated by <code>scripts/visual-docs-data.mjs</code> from the source tree
            rather than typed by hand, which is what keeps it from drifting. With scripting off, read
            <code>docs/architecture/components.html</code>, <code>docs/architecture/TARGET_ARCHITECTURE.md</code>
            and <code>PLATFORM_DOCUMENTATION.md</code> instead.</p>
          </div></section>
        </noscript>
      </div>
    </main>
  </div>
</div>

<!-- ── Search palette ─────────────────────────────────────────────────────────────── -->
<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Search the atlas">
  <div class="box">
    <input id="paletteInput" type="text" autocomplete="off" spellcheck="false"
           placeholder="Search routes, modules, services, roles, endpoints, fields, terms…" aria-label="Search query">
    <div class="results" id="paletteResults" role="listbox" aria-label="Search results"></div>
    <footer><span>↑↓ move</span><span>⏎ open</span><span>esc close</span></footer>
  </div>
</div>

<script src="platform-data.js"></script>
<script src="app.js"></script>
</body>
</html>
